<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kira Karaoke Console Demo</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #0d0e10;
      --surface: #18191d;
      --surface-2: #222329;
      --surface-3: #2b2d34;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --text: #f7f4ee;
      --muted: #a8a6a0;
      --soft: #ddd8cf;
      --cream: #f4eee2;
      --red: #dd3e38;
      --red-2: #a91f1a;
      --amber: #f2b84b;
      --teal: #22c59b;
      --blue: #5e9cff;
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
      --shadow-soft: 0 10px 26px rgba(0, 0, 0, 0.22);
      --card-blue: #3277f2;
      --card-cyan: #14bfd0;
      --card-pink: #e95895;
      --card-violet: #4c36b8;
      --card-orange: #dc7a32;
      --design-width: 1536px;
      --design-height: 864px;
      --app-scale: 1.25;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #050506;
      color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Yu Gothic", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      user-select: none;
    }

    .app {
      width: var(--design-width);
      height: var(--design-height);
      display: grid;
      grid-template-rows: 76px 1fr 92px;
      background: #0d0e10;
      box-shadow: 0 0 48px rgba(0, 0, 0, 0.5);
      transform: scale(var(--app-scale));
      transform-origin: center;
      container-type: size;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(392px, 1fr);
      align-items: center;
      gap: 22px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 19, 23, 0.96);
    }

    .top-left-head {
      min-width: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.18);
      background: #fff;
    }

    .brand-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.12;
    }

    .brand-text strong {
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ticker {
      height: 48px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111216;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .ticker::before,
    .ticker::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: 56px;
      pointer-events: none;
    }

    .ticker::before {
      left: 0;
      background: linear-gradient(90deg, #111216, transparent);
    }

    .ticker::after {
      right: 0;
      background: linear-gradient(270deg, #111216, transparent);
    }

    .ticker-track {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 32px;
      width: max-content;
      padding-left: 100%;
      white-space: nowrap;
      animation: tickerMove 26s linear infinite;
    }

    .ticker:hover .ticker-track {
      animation-play-state: paused;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--cream);
      font-size: 16px;
      font-weight: 900;
    }

    .ticker-tag {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      background: rgba(242, 184, 75, 0.1);
      border: 1px solid rgba(242, 184, 75, 0.18);
      color: var(--amber);
      font-size: 14px;
      font-weight: 900;
    }

    @keyframes tickerMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-100%);
      }
    }

    .top-actions {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px 78px 92px;
      gap: 12px;
      align-items: center;
    }

    .search {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f3eee5;
      color: #27292f;
    }

    .search i {
      color: var(--red);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17181c;
      font-weight: 800;
    }

    .search input::placeholder {
      color: #77746d;
    }

    .top-btn {
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--cream);
      font-size: 15px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .top-btn i {
      flex: 0 0 auto;
    }

    .top-btn:hover,
    .icon-btn:hover,
    .remote-btn:hover,
    .menu-card:hover,
    .small-card:hover {
      filter: brightness(1.08);
    }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(392px, 1fr);
      gap: 22px;
      padding: 22px 24px 18px;
      background: #111216;
    }

    .main[hidden],
    .browser-page[hidden] {
      display: none;
    }

    .left-pane,
    .right-pane {
      min-height: 0;
      display: grid;
      gap: 18px;
    }

    .left-pane {
      grid-template-rows: minmax(360px, 1fr) 118px;
    }

    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
    }

    .stage-media {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0.68)),
        url("Kirakara-Player/images/preview.png");
      background-size: cover;
      background-position: center;
      transform: scale(1.035);
      filter: saturate(0.98) contrast(1.05);
    }

    .stage-vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.86), transparent 25%, transparent 72%, rgba(0,0,0,0.72)),
        linear-gradient(180deg, rgba(0,0,0,0.22), transparent 34%, rgba(0,0,0,0.86));
    }

    .stage-header {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .pill {
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(17,18,22,0.74);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--cream);
      font-size: 13px;
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 16px rgba(34,197,155,0.84);
    }

    .stage-qr {
      position: absolute;
      top: 72px;
      right: 26px;
      width: 116px;
      height: 116px;
      display: grid;
      grid-template-rows: 1fr 30px;
      place-items: center;
      padding: 12px;
      border-radius: 8px;
      background: rgba(244, 238, 226, 0.95);
      color: #17181c;
      font-weight: 900;
      box-shadow: 0 14px 36px rgba(0,0,0,0.28);
    }

    .stage-qr i {
      color: #17181c;
    }

    .stage-qr span {
      font-size: 14px;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.18);
    }

    .stage.playing .play-overlay {
      display: none;
    }

    .play-circle {
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      border-radius: 55px;
      color: #17181c;
      background: var(--cream);
      box-shadow: 0 16px 52px rgba(0,0,0,0.36);
    }

    .play-circle i {
      width: 54px;
      height: 54px;
      stroke-width: 2.4;
      margin-left: 4px;
    }

    .lyric {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 54px;
      display: grid;
      gap: 18px;
      text-align: center;
      pointer-events: none;
    }

    .ruby {
      display: block;
      margin-bottom: 5px;
      color: #fff;
      font-size: clamp(16px, 1.25cqw, 22px);
      font-weight: 900;
      text-shadow:
        2px 0 0 #1a1b20,
        -2px 0 0 #1a1b20,
        0 2px 0 #1a1b20,
        0 -2px 0 #1a1b20;
    }

    .main-line,
    .next-line {
      display: block;
      line-height: 1.08;
      color: #fff;
      font-weight: 900;
      text-shadow:
        4px 0 0 #101114,
        -4px 0 0 #101114,
        0 4px 0 #101114,
        0 -4px 0 #101114,
        3px 3px 0 #101114,
        -3px 3px 0 #101114,
        3px -3px 0 #101114,
        -3px -3px 0 #101114,
        0 10px 22px rgba(0,0,0,0.52);
    }

    .main-line {
      font-size: clamp(44px, 4.2cqw, 72px);
    }

    .next-line {
      font-size: clamp(31px, 3cqw, 50px);
      opacity: 0.9;
    }

    .sung {
      color: #fff06a;
      text-shadow:
        4px 0 0 var(--red-2),
        -4px 0 0 var(--red-2),
        0 4px 0 var(--red-2),
        0 -4px 0 var(--red-2),
        3px 3px 0 var(--red-2),
        -3px 3px 0 var(--red-2),
        3px -3px 0 var(--red-2),
        -3px -3px 0 var(--red-2),
        0 10px 22px rgba(0,0,0,0.52);
    }

    .song-strip {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 214px;
      gap: 18px;
    }

    .now-card,
    .key-card {
      min-width: 0;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }

    .now-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 17px 22px;
    }

    .cover {
      width: 78px;
      height: 78px;
      flex: 0 0 auto;
      border-radius: 8px;
      background-image:
        linear-gradient(135deg, rgba(221,62,56,0.16), rgba(242,184,75,0.22)),
        url("Kirakara-Player/images/logo.png");
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .song-meta {
      min-width: 0;
    }

    .song-meta strong,
    .song-meta span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song-meta strong {
      color: var(--cream);
      font-size: clamp(26px, 2.1cqw, 34px);
      font-weight: 900;
      line-height: 1.14;
    }

    .song-meta span {
      margin-top: 8px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 800;
    }

    .key-card {
      display: grid;
      grid-template-rows: 38px 1fr;
      padding: 15px;
    }

    .key-card label {
      color: var(--muted);
      font-size: 16px;
      font-weight: 900;
    }

    .key-control {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      justify-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      color: var(--cream);
    }

    .key-value {
      min-width: 74px;
      color: var(--amber);
      font-size: 38px;
      font-weight: 900;
      text-align: center;
    }

    .right-pane {
      grid-template-rows: 1fr 1fr 1fr 118px;
    }

    .menu-card {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 86px;
      align-items: center;
      gap: 18px;
      padding: 0 clamp(22px, 2cqw, 34px);
      border-radius: 8px;
      text-align: left;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: var(--shadow-soft);
    }

    .menu-card.primary {
      background: linear-gradient(135deg, #8f2425, #dd3e38 54%, #e58c41);
      border-color: rgba(255,255,255,0.24);
    }

    .menu-card.primary::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 8px;
      background: rgba(255,255,255,0.72);
    }

    .menu-card.singer-card {
      background: linear-gradient(135deg, #2f62db, var(--card-blue) 58%, #70a7ff);
      border-color: rgba(176, 208, 255, 0.38);
    }

    .menu-card.category-card {
      background: linear-gradient(135deg, #bb3d79, var(--card-pink) 56%, #ff91bd);
      border-color: rgba(255, 190, 218, 0.38);
    }

    .menu-card.search-card {
      background: linear-gradient(135deg, #087c88, var(--card-cyan) 58%, #67e0e8);
      border-color: rgba(164, 244, 247, 0.36);
    }

    .menu-card::after,
    .small-card::after {
      content: "";
      position: absolute;
      inset: auto -38px -54px auto;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      pointer-events: none;
    }

    .menu-text {
      min-width: 0;
    }

    .menu-text strong {
      display: block;
      color: #fffaf2;
      font-size: clamp(30px, 2.6cqw, 44px);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-text span {
      display: block;
      margin-top: 9px;
      color: rgba(255,255,255,0.78);
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
      max-height: 28px;
      overflow: hidden;
    }

    .menu-chips b {
      height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      font-weight: 900;
    }

    .menu-card i {
      width: 58px;
      height: 58px;
      justify-self: end;
      color: rgba(255,255,255,0.92);
      opacity: 0.94;
      stroke-width: 1.7;
      z-index: 1;
    }

    .right-bottom {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 118px;
      gap: 18px;
    }

    .small-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #281b72, var(--card-violet) 58%, #6d54d6);
      border: 1px solid rgba(175, 158, 255, 0.36);
      color: #fffaf2;
      font-size: clamp(21px, 2cqw, 30px);
      font-weight: 900;
      box-shadow: var(--shadow-soft);
    }

    .small-card.compact {
      background: linear-gradient(135deg, #a85422, var(--card-orange));
      border-color: rgba(255, 205, 156, 0.34);
    }

    .small-card.compact {
      flex-direction: column;
      gap: 7px;
      font-size: 17px;
    }

    .small-card i {
      color: rgba(255,255,255,0.9);
      z-index: 1;
    }

    .small-card span,
    .small-card:not(.compact) {
      z-index: 1;
    }

    .bottombar {
      display: grid;
      grid-template-columns: 156px minmax(250px, 320px) 156px minmax(510px, 1fr);
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      background: #15161a;
      border-top: 1px solid var(--line);
    }

    .remote-btn,
    .volume {
      height: 64px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .remote-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--cream);
      font-size: 20px;
      font-weight: 900;
    }

    .remote-btn.active {
      background: var(--red);
      border-color: rgba(255,255,255,0.18);
      color: #fff;
    }

    .remote-btn.green {
      color: var(--teal);
    }

    .transport-group {
      justify-self: end;
      display: grid;
      grid-template-columns: repeat(3, 156px);
      gap: 14px;
    }

    .volume {
      display: grid;
      grid-template-columns: 62px 38px 1fr 38px;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
    }

    .volume label {
      color: var(--cream);
      font-size: 20px;
      font-weight: 900;
    }

    .volume button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      color: var(--cream);
    }

    .meter {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #34363d;
    }

    .meter-fill {
      width: 72%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--amber));
    }

    .browser-page {
      min-height: 0;
      padding: 22px 24px 18px;
      background: #111216;
    }

    .browser-shell {
      min-height: 0;
      height: 100%;
      background: #111216;
    }

    .browser-back {
      height: 46px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--cream);
      font-weight: 900;
    }

    .browser-back {
      width: 108px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .browser-search {
      width: 100%;
      min-width: 0;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--cream);
      border: 1px solid rgba(255,255,255,0.12);
      color: #17181c;
    }

    .browser-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17181c;
      font-weight: 900;
    }

    .browser-layout {
      min-height: 0;
      display: grid;
      gap: 18px;
      height: 100%;
    }

    .singer-search-layout {
      grid-template-columns: 330px minmax(0, 1fr) 390px;
    }

    .singer-detail-layout {
      grid-template-columns: 330px minmax(0, 1fr) 390px;
    }

    .category-layout {
      grid-template-columns: 330px minmax(0, 1fr) 390px;
    }

    .song-search-layout {
      grid-template-columns: 330px minmax(0, 1fr) 390px;
    }

    .filter-rail,
    .artist-detail-rail,
    .category-detail {
      min-height: 0;
    }

    .filter-rail {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .artist-detail-rail {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0%, rgba(94,156,255,0.13), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .rail-controls {
      display: grid;
      justify-items: start;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .category-tab span {

      font-weight: 900;

    .modal-backdrop {

      background: rgba(0,0,0,0.62);

    .modal {

      font-weight: 900;

      grid-template-columns: minmax(0, 1fr) 390px;

      min-height: 0;

      flex-direction: column;

      padding: 22px;
      border-radius: 8px;

      border: 1px solid var(--line);

      grid-template-columns: 1fr 108px;

      align-items: center;

      padding: 0 14px;

    }

    function attachInputPanelHandlers(setQuery, renderFn) {
      const input = $("panelSearch");
      const commit = (value) => {
        setQuery(value);
        renderFn();
        const nextInput = $("panelSearch");
        nextInput?.focus();
        nextInput?.setSelectionRange(value.length, value.length);
      };

      input?.addEventListener("input", (event) => {
        commit(event.target.value);
      });

      document.querySelectorAll("[data-input-key]").forEach((button) => {
        button.addEventListener("click", () => {
          commit(`${$("panelSearch")?.value || ""}${button.dataset.inputKey || ""}`);
        });
      });

      document.querySelectorAll("[data-input-backspace]").forEach((button) => {
        button.addEventListener("click", () => {
          const value = $("panelSearch")?.value || "";
          commit(value.slice(0, -1));
        });
      });

      document.querySelectorAll("[data-input-clear]").forEach((button) => {
        button.addEventListener("click", () => commit(""));
      });

      document.querySelectorAll("[data-input-candidate]").forEach((button) => {
        button.addEventListener("click", () => commit(button.dataset.inputCandidate || ""));
      });

      document.querySelectorAll("[data-input-submit]").forEach((button) => {
        button.addEventListener("click", () => {
          $("announce").textContent = `搜索：${$("panelSearch")?.value || ""}`;
        });
      });

      document.querySelectorAll("[data-ime-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          imeMode = button.dataset.imeMode || "英文";
          renderFn();
        });
      });

      document.querySelectorAll("[data-search-tab]").forEach((button) => {
        button.addEventListener("click", () => switchSearchTab(button.dataset.searchTab || "歌名"));
      });
    }

    function switchSearchTab(tab) {
      if (tab === "歌手") {
        activeArtist = "";
        renderSingerPanel();
        return;
      }

      if (tab === "分类") {
        renderCategoryPanel();
        return;
      }

      songSearchMode = "歌名";
      renderSongPanel();
    }

    function songMatches(song, query) {
      if (!query) return true;
      const needle = query.toLowerCase();
      return [song.name, song.artist, song.code, song.category, song.type]
        .some((part) => String(part || "").toLowerCase().includes(needle));
    }

    function getSongsForCategory(categoryName) {
      if (categoryName === "热门") {
        return songs.slice(0, 6);
      }
      return songs.filter((song) => song.category === categoryName);
    }

    function renderSongRows(list) {
      if (!list.length) {
        return '<div class="empty-state">没有找到匹配歌曲</div>';
      }

      return list.map((song, index) => `
        <div class="song-row">
          <div class="song-index">${String(index + 1).padStart(2, "0")}</div>
          <div>
            <strong>${escapeHtml(song.name)}</strong>
            <span>${escapeHtml(song.artist)} · ${escapeHtml(song.category)} · ${escapeHtml(song.code)}</span>
          </div>
          <div class="song-actions">
            <button class="bump-song" data-bump-code="${escapeHtml(song.code)}"><i data-lucide="arrow-up-to-line"></i>顶歌</button>
            <button class="add-song" data-song-code="${escapeHtml(song.code)}">点歌</button>
          </div>
        </div>
      `).join("");
    }

    function renderDetail(title, subtitle, songList) {
      return `
        <section class="category-detail">
          <div class="category-hero">
            <div>
              <strong>${escapeHtml(title)}</strong>
              <span>${escapeHtml(subtitle)}</span>
            </div>
            <div class="category-count">${songList.length}</div>
          </div>
          <div class="song-list">${renderSongRows(songList)}</div>
        </section>
      `;
    }

    function getSongSearchTitle() {
      if (songSearchMode === "编号") return "编号点歌";
      if (songSearchMode === "收藏") return "收藏点歌";
      return "歌名点歌";
    }

    function songMatchesGlobalMode(song, query) {
      if (songSearchMode === "收藏") {
        return songs.indexOf(song) < 6 && songMatches(song, query);
      }

      if (!query) {
        return true;
      }

      const needle = query.toLowerCase();
      if (songSearchMode === "编号") {
        return song.code.toLowerCase().includes(needle);
      }

      return [song.name, song.artist, song.code, song.category]
        .some((part) => String(part || "").toLowerCase().includes(needle));
    }

    function renderSongPanel() {
      browserMode = "song";
      const normalizedQuery = songQuery.trim();
      const scopedSongs = songs.filter((song) => {
        const scopeOk = songScope === "全部" || song.category === songScope;
        return scopeOk && songMatchesGlobalMode(song, normalizedQuery);
      });
      const title = getSongSearchTitle();
      const scopeList = ["全部", ...categoryCatalog.map((category) => category.name).filter((name) => name !== "热门")];

      showBrowserPage(title, `
        <div class="browser-layout song-search-layout">
          <aside class="filter-rail">
            ${renderBackControl()}
            <div class="singer-category-list">
              <h3>搜索范围</h3>
              ${scopeList.map((scope) => `
                <button class="singer-category-option ${scope === songScope ? "active" : ""}" data-song-scope="${escapeHtml(scope)}">
                  ${escapeHtml(scope)}
                </button>
              `).join("")}
            </div>
          </aside>
          ${renderDetail(title, songScope === "全部" ? "全曲库搜索" : `${songScope} 分类内搜索`, scopedSongs)}
          ${renderInputPanel({
            placeholder: "搜索歌名、歌手、编号",
            value: songQuery,
            activeTab: "歌名",
          })}
        </div>
      `);

      attachInputPanelHandlers((value) => {
        songQuery = value;
      }, renderSongPanel);

      document.querySelectorAll("[data-song-scope]").forEach((button) => {
        button.addEventListener("click", () => {
          songScope = button.dataset.songScope;
          renderSongPanel();
        });
      });

      attachAddSongHandlers();
    }

    let queue = [];

    function addToQueue(song) {
      queue.push(song);
      $("announce").textContent = `已加入队列：${song.name}`;
    }

    function bumpToNext(song) {
      queue.unshift(song);
      $("announce").textContent = `已顶到下一首：${song.name}`;
    }

    function removeFromQueue(index) {
      const removed = queue.splice(index, 1)[0];
      if (removed) {
        $("announce").textContent = `已从队列移除：${removed.name}`;
      }
      return removed;
    }

    function attachAddSongHandlers() {
      document.querySelectorAll("[data-song-code]").forEach((button) => {
        button.addEventListener("click", () => {
          const song = songs.find((item) => item.code === button.dataset.songCode);
          if (!song) return;
          addToQueue(song);
          button.textContent = "已点";
          button.style.background = "var(--teal)";
        });
      });

      document.querySelectorAll("[data-bump-code]").forEach((button) => {
        button.addEventListener("click", () => {
          const song = songs.find((item) => item.code === button.dataset.bumpCode);
          if (!song) return;
          bumpToNext(song);
        });
      });
    }

    function renderQueueModal() {
      const currentSong = songs[songIndex];
      const modalHtml = `
        <div class="modal-body">
          <div class="queue-list">
            <div class="queue-item current">
              <div class="song-index" style="background:var(--teal);color:#17181c;">
                <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#17181c;"></span>
              </div>
              <div class="queue-item-meta">
                <strong>${escapeHtml(currentSong.name)}</strong>
                <span>${escapeHtml(currentSong.artist)} · 正在播放</span>
              </div>
              <span class="queue-playing-badge"><span class="dot"></span>播放中</span>
            </div>
            <div class="queue-divider"></div>
            <div class="queue-divider-label">下一首</div>
            ${queue.length === 0
              ? '<div style="padding:20px;text-align:center;color:var(--muted);font-weight:800;">队列为空，去点一首歌吧</div>'
              : queue.map((song, index) => `
                <div class="queue-item">
                  <div class="song-index">${String(index + 1).padStart(2, "0")}</div>
                  <div class="queue-item-meta">
                    <strong>${escapeHtml(song.name)}</strong>
                    <span>${escapeHtml(song.artist)} · ${escapeHtml(song.category)}</span>
                  </div>
                  <div class="queue-item-actions">
                    <button class="queue-action-btn bump" data-queue-bump="${index}" title="顶到下一首"><i data-lucide="arrow-up-to-line"></i></button>
                    <button class="queue-action-btn danger" data-queue-remove="${index}" title="移除"><i data-lucide="x"></i></button>
                  </div>
                </div>
              `).join("")}
          </div>
        </div>
      `;

      showModal("点歌列表", modalHtml);
      $("modalBox").classList.add("queue-modal");
      setIcons();

      document.querySelectorAll("[data-queue-bump]").forEach((button) => {
        button.addEventListener("click", () => {
          const idx = parseInt(button.dataset.queueBump, 10);
          if (idx >= 0 && idx < queue.length) {
            const song = queue.splice(idx, 1)[0];
            queue.unshift(song);
            $("announce").textContent = `已顶到下一首：${song.name}`;
            renderQueueModal();
          }
        });
      });

      document.querySelectorAll("[data-queue-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          const idx = parseInt(button.dataset.queueRemove, 10);
          removeFromQueue(idx);
          renderQueueModal();
        });
      });
    }
    
    function renderSingerPanel() {
      browserMode = "singer";
      const normalizedQuery = singerQuery.trim();
      const filteredArtists = artistCatalog.filter((artist) => {
        const groupOk = singerCategory === "全部" || artist.group === singerCategory;
        const searchOk = !normalizedQuery || [artist.name, artist.type, artist.group, artist.note]
          .some((part) => String(part || "").toLowerCase().includes(normalizedQuery.toLowerCase()));
        return groupOk && searchOk;
      });

      if (activeArtist) {
        const activeMeta = artistCatalog.find((artist) => artist.name === activeArtist) || artistCatalog[0];
        const songQuery = singerSongQuery.trim();
        const artistSongCount = songs.filter((song) => song.artist === activeArtist || song.artist.includes(activeArtist)).length;
        const artistSongs = songs
          .filter((song) => song.artist === activeArtist || song.artist.includes(activeArtist))
          .filter((song) => songMatches(song, songQuery));

        showBrowserPage("歌手点歌", `
          <div class="browser-layout singer-detail-layout">
            <aside class="artist-detail-rail">
              ${renderBackControl()}
              <section class="artist-profile" aria-label="当前歌手">
                <div class="artist-profile-photo">${escapeHtml(activeMeta.name.slice(0, 1))}</div>
                <div class="artist-profile-info">
                  <strong>${escapeHtml(activeMeta.name)}</strong>
                  <p>${escapeHtml(activeMeta.group)} · ${escapeHtml(activeMeta.note)}</p>
                </div>
                <div class="artist-profile-count">共 ${artistSongCount} 首歌曲</div>
              </section>
            </aside>
            ${renderDetail(activeMeta.name, `${activeMeta.type} · ${activeMeta.note}`, artistSongs)}
            ${renderInputPanel({
              placeholder: `在 ${activeMeta.name} 的歌曲中搜索`,
              value: singerSongQuery,
              activeTab: "歌手内",
              tabs: ["歌手内"],
              localOnly: true,
            })}
          </div>
        `);

        attachInputPanelHandlers((value) => {
          singerSongQuery = value;
        }, renderSingerPanel);
        attachAddSongHandlers();
        return;
      }

      showBrowserPage("歌手点歌", `
        <div class="browser-layout singer-search-layout">
            <aside class="filter-rail">
              ${renderBackControl()}
              <div class="singer-category-list">
                <h3>地区与类型</h3>
                ${singerCategories.map((category) => `
                  <button class="singer-category-option ${category === singerCategory ? "active" : ""}" data-singer-category="${escapeHtml(category)}">
                    ${escapeHtml(category)}
                  </button>
                `).join("")}
              </div>
          </aside>
          <section class="artist-results">
            <div class="artist-grid">
              ${filteredArtists.map((artist) => {
                const artistSongCount = songs.filter((song) => song.artist === artist.name || song.artist.includes(artist.name)).length;
                return `
                  <button class="artist-card" data-artist="${escapeHtml(artist.name)}">
                    <div class="artist-avatar">${escapeHtml(artist.name.slice(0, 1))}</div>
                    <div class="artist-meta">
                      <strong>${escapeHtml(artist.name)}</strong>
                      <span>${escapeHtml(artist.type)} · ${escapeHtml(artist.note)}</span>
                      <b class="artist-hit-count">${artistSongCount} 首歌曲</b>
                    </div>
                  </button>
                `;
              }).join("") || '<div class="empty-state">没有匹配歌手</div>'}
            </div>
          </section>
          ${renderInputPanel({
            placeholder: "搜索歌手、角色、社团或声库",
            value: singerQuery,
            activeTab: "歌手",
          })}
        </div>
      `);

      attachInputPanelHandlers((value) => {
        singerQuery = value;
      }, renderSingerPanel);

      document.querySelectorAll("[data-singer-category]").forEach((button) => {
        button.addEventListener("click", () => {
          singerCategory = button.dataset.singerCategory;
          activeArtist = "";
          renderSingerPanel();
        });
      });

      document.querySelectorAll("[data-artist]").forEach((button) => {
        button.addEventListener("click", () => {
          activeArtist = button.dataset.artist;
          singerSongQuery = "";
          renderSingerPanel();
        });
      });
    }

    function renderCategoryPanel() {
      browserMode = "category";
      const normalizedQuery = categoryQuery.trim();
      const activeMeta = categoryCatalog.find((category) => category.name === activeCategory) || categoryCatalog[0];
      const categorySongs = getSongsForCategory(activeMeta.name).filter((song) => songMatches(song, normalizedQuery));

      showBrowserPage("分类点歌", `
        <div class="browser-layout category-layout">
            <aside class="filter-rail">
              ${renderBackControl()}
              <div class="category-list">
              ${categoryCatalog.map((category) => `
                <button class="category-tab ${category.name === activeCategory ? "active" : ""}" data-category="${escapeHtml(category.name)}">
                  <span class="category-icon"><i data-lucide="${category.icon}"></i></span>
                  <div>
                    <strong>${escapeHtml(category.name)}</strong>
                    <span>${escapeHtml(category.note)}</span>
                  </div>
                </button>
              `).join("")}
              </div>
            </aside>
            ${renderDetail(activeMeta.name, activeMeta.note, categorySongs)}
            ${renderInputPanel({
              placeholder: "在当前分类中搜索歌曲、歌手、编号",
              value: categoryQuery,
              activeTab: "分类",
            })}
          </div>
      `);

      attachInputPanelHandlers((value) => {
        categoryQuery = value;
      }, renderCategoryPanel);

      document.querySelectorAll("[data-category]").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          renderCategoryPanel();
        });
      });

      attachAddSongHandlers();
    }

    function renderExternalLinkPanel() {
      browserMode = "external-link";
      showBrowserPage("外链点歌", `
        <div class="browser-layout external-link-layout">
          <div class="link-parse-panel">
            ${renderBackControl()}
            <div style="display:grid;gap:14px;">
              <label class="rail-label">粘贴视频或音频链接自动解析</label>
              <div class="link-input-row">
                <label class="link-input">
                  <i data-lucide="link"></i>
                  <input id="linkInput" type="url" placeholder="https://www.bilibili.com/video/BV... 或 YouTube / Niconico 等" disabled>
                </label>
                <button class="parse-btn" disabled><i data-lucide="search"></i>解析</button>
              </div>
              <p class="parse-hint">基于 <b>bilikara</b> 引擎，支持 Bilibili、YouTube、Niconico 等平台。解析逻辑将在后续版本接入，届时支持 Windows 端粘贴与手机扫码输入。</p>
            </div>
            <div class="parse-result-list">
              <div class="parse-placeholder">
                <span>外链解析功能即将上线<br>敬请期待</span>
              </div>
            </div>
          </div>
          ${renderInputPanel({
            placeholder: "搜索已解析的外链歌曲",
            value: "",
            activeTab: "外链",
            tabs: ["外链"],
            localOnly: true,
          })}
        </div>
      `);

      setIcons();
    }

    function renderRankingPanel() {
      browserMode = "ranking";
      const rankingSongs = [...songs].sort(() => Math.random() - 0.5).slice(0, 8);
      const activeMeta = rankingCategories.find((r) => r.name === activeRanking) || rankingCategories[0];

      showBrowserPage("排行榜", `
        <div class="browser-layout ranking-layout">
          <aside class="ranking-rail">
            ${renderBackControl()}
            <div class="singer-category-list">
              <h3>榜单分类</h3>
              ${rankingCategories.map((ranking) => `
                <button class="ranking-category ${ranking.name === activeRanking ? "active" : ""}" data-ranking="${escapeHtml(ranking.name)}">
                  <span class="ranking-icon"><i data-lucide="${ranking.icon}"></i></span>
                  <div>
                    <strong>${escapeHtml(ranking.name)}</strong>
                    <span>${escapeHtml(ranking.note)}</span>
                  </div>
                </button>
              `).join("")}
            </div>
          </aside>
          <section class="category-detail">
            <div class="category-hero">
              <div>
                <strong>${escapeHtml(activeMeta.name)}</strong>
                <span>${escapeHtml(activeMeta.note)}</span>
              </div>
              <div class="category-count">${rankingSongs.length}</div>
            </div>
            <div class="song-list">
              ${rankingSongs.map((song, index) => {
                const rankClass = index < 3 ? ' ranked top3' : ' ranked';
                return `
                  <div class="song-row${rankClass}">
                    <div class="song-index">${String(index + 1).padStart(2, "0")}</div>
                    <div>
                      <strong>${escapeHtml(song.name)}</strong>
                      <span>${escapeHtml(song.artist)} · ${escapeHtml(song.category)}</span>
                    </div>
                    <button class="add-song" data-song-code="${escapeHtml(song.code)}">点歌</button>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
          ${renderInputPanel({
            placeholder: "在排行榜中搜索歌曲",
            value: "",
            activeTab: "排行",
            tabs: ["排行"],
            localOnly: true,
          })}
        </div>
      `);

      attachAddSongHandlers();

      document.querySelectorAll("[data-ranking]").forEach((button) => {
        button.addEventListener("click", () => {
          activeRanking = button.dataset.ranking;
          renderRankingPanel();
        });
      });

      setIcons();
    }

    $("stagePlay").addEventListener("click", () => setPlaying(true));
    $("playBtn").addEventListener("click", () => setPlaying(!playing));
    $("keyDown").addEventListener("click", () => setKey(key - 1));
    $("keyUp").addEventListener("click", () => setKey(key + 1));
    $("volDown").addEventListener("click", () => setVolume(volume - 6));
    $("volUp").addEventListener("click", () => setVolume(volume + 6));
    $("nextBtn").addEventListener("click", () => {
      setSong(songIndex + 1);
      setPlaying(true);
    });
    $("replayBtn").addEventListener("click", () => {
      $("announce").textContent = "已从当前歌曲开头重唱";
      setPlaying(true);
    });
    $("vocalBtn").addEventListener("click", () => {
      vocal = !vocal;
      $("vocalBtn").innerHTML = vocal
        ? '<i data-lucide="audio-lines"></i>原唱'
        : '<i data-lucide="music"></i>伴奏';
      $("announce").textContent = vocal ? "已切换为原唱" : "已切换为伴奏";
      setIcons();
    });
    $("queueBtn").addEventListener("click", () => {
      renderQueueModal();
    });
    $("qrTop").addEventListener("click", () => {
      openModal("手机点歌", "扫码后可在手机上搜索歌曲、调整顺序并加入播放队列。", { qr: true });
    });
    $("qrStage").addEventListener("click", () => {
      openModal("手机点歌", "扫码后可在手机上搜索歌曲、调整顺序并加入播放队列。", { qr: true });
    });
    $("settingsBtn").addEventListener("click", () => {
      openModal("设定", "房间编号、音频输出、点歌端口、歌词显示和系统控制集中在这里。");
    });
    $("windowsBtn").addEventListener("click", () => {
      openModal("Windows 主控", "这里可以切换窗口、打开系统音量或回到桌面控制。");
    });
    $("modalClose").addEventListener("click", closeModal);
    $("modalBody").addEventListener("click", (event) => {
      if (event.target.closest("[data-close-modal]")) closeModal();
    });
    $("modal").addEventListener("click", (event) => {
      if (event.target === $("modal")) closeModal();
    });

    document.querySelectorAll("[data-panel]").forEach((button) => {
      button.addEventListener("click", () => {
        const title = button.dataset.panel;
        if (title === "歌名点歌") {
          songSearchMode = "歌名";
          renderSongPanel();
        } else if (title === "歌手点歌") {
          activeArtist = "";
          singerSongQuery = "";
          renderSingerPanel();
        } else if (title === "分类点歌") {
          renderCategoryPanel();
        } else if (title === "外链点歌") {
          renderExternalLinkPanel();
        } else if (title === "排行榜") {
          renderRankingPanel();
        } else {
          openModal(title, `${title} 会显示可触控列表、筛选条件和加入队列按钮。`);
        }
      });
    });

    $("searchInput").addEventListener("focus", () => {
      songSearchMode = "歌名";
      songQuery = $("searchInput").value.trim();
      renderSongPanel();
    });

    $("searchInput").addEventListener("input", (event) => {
      const value = event.target.value.trim();
      if (browserMode === "song") {
        songQuery = value;
        renderSongPanel();
      }
      $("announce").textContent = value ? `搜索：${value}` : "欢迎使用 Kira Karaoke";
    });

    window.addEventListener("resize", syncAppScale);

    syncAppScale();
    setSong(0);
    setKey(key);
    setVolume(volume);
    setIcons();
  </script>
</body>
</html>
